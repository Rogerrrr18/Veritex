server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy, backend url from env BACKEND_URL
    location /chat { proxy_pass ${BACKEND_URL}; }
    location /expand_keywords { proxy_pass ${BACKEND_URL}; }
    location /search_papers { proxy_pass ${BACKEND_URL}; }
    location /multi_source_search { proxy_pass ${BACKEND_URL}; }
    location /analyze_discipline { proxy_pass ${BACKEND_URL}; }
    location /batch_expand { proxy_pass ${BACKEND_URL}; }
    location /performance { proxy_pass ${BACKEND_URL}; }
    location /health { proxy_pass ${BACKEND_URL}; }
    location /clear_cache { proxy_pass ${BACKEND_URL}; }
    location /analytics { proxy_pass ${BACKEND_URL}; }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}


