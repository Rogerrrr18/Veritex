server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 🚫 强制禁用所有缓存头
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT" always;
    
    # 🔄 版本标识头（用于调试）
    add_header X-Frontend-Version "3.0.6" always;
    add_header X-Cache-Bust "$(date +%s)" always;
    
    # 📱 主应用路由
    location / {
        try_files $uri $uri/ /index.html;
        
        # 🚫 额外的无缓存头
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Last-Modified "Thu, 01 Jan 1970 00:00:01 GMT" always;
        add_header ETag "" always;
    }
    
    # 📦 静态资源防缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT" always;
        add_header X-Frontend-Version "3.0.6" always;
    }
    
    # 🔍 版本检查端点
    location /version {
        add_header Content-Type "application/json" always;
        return 200 '{"version":"3.0.6","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","cache_bust":true}';
    }
    
    # 📡 API代理（如果需要）
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API响应也不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
