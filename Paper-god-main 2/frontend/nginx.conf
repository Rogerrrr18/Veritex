server {
	listen 80;
	server_name _;

	# 前端静态资源
	root /usr/share/nginx/html;
	index index.html;

	# 反向代理到后端（Docker网络内部通信）
	location /chat {
		proxy_pass http://veritex-backend:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
	}
	location /expand_keywords { proxy_pass http://veritex-backend:8000; }
	location /search_papers { proxy_pass http://veritex-backend:8000; }
	location /multi_source_search { proxy_pass http://veritex-backend:8000; }
	location /analyze_discipline { proxy_pass http://veritex-backend:8000; }
	location /batch_expand { proxy_pass http://veritex-backend:8000; }
	location /performance { proxy_pass http://veritex-backend:8000; }
	location /health { proxy_pass http://veritex-backend:8000; }
	location /clear_cache { proxy_pass http://veritex-backend:8000; }
	location /analytics { proxy_pass http://veritex-backend:8000; }

	# SPA 路由回退
	location / {
		try_files $uri $uri/ /index.html;
	}
}
