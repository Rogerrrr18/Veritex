services:
  backend:
    image: crpi-l5gw8z003atf7dof.cn-heyuan.personal.cr.aliyuncs.com/veritex/backend:3.0.0
    container_name: paper-god-backend
    restart: unless-stopped
    environment:
      - ACTIVE_MODEL=doubao
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=https://ark.cn-beijing.volces.com
      - ARK_MODEL_NAME=doubao-seed-1-6-250615
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nimport urllib.request, sys\ntry:\n  with urllib.request.urlopen('http://localhost:8000/health', timeout=3) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: crpi-l5gw8z003atf7dof.cn-heyuan.personal.cr.aliyuncs.com/veritex/frontend:3.0.0
    container_name: paper-god-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:80"


